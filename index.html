<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RNG World</title><style>body{margin:0;font-family:Arial;background:#0b0d1c;color:white;text-align:center}main{max-width:800px;margin:auto;padding:40px}.box{background:#171a31;border-radius:20px;padding:30px}.orb{font-size:80px;margin:30px}.roll{font-size:24px;padding:15px 60px;border:0;border-radius:12px;cursor:pointer}#result{font-size:30px;font-weight:bold}.inv{text-align:left;margin-top:30px;line-height:2}</style></head><body><main><div class="box"><h1>✨ RNG WORLD</h1><p>🎲 Rolls: <b id="rolls">0</b> · 🪙 Coins: <b id="coins">0</b> · 🍀 Luck: <b id="luck">1.00</b>x</p><div class="orb" id="orb">?</div><div id="result">Haz tu primer roll</div><p id="odds">Las probabilidades están esperando...</p><button class="roll" onclick="roll()">🎲 ROLL</button><div class="inv" id="inv"></div></div></main><script>const items=[['🪨','Piedra','COMMON',60,'1/1.7'],['💎','Cristal','RARE',25,'1/4'],['🌀','Portal','EPIC',10,'1/10'],['👑','Corona Solar','LEGENDARY',4,'1/25'],['🌟','Estrella Oscura','MYTHIC',.9,'1/111'],['🌌','VOID','SECRET',.1,'1/1,000']];let d=JSON.parse(localStorage.rng||'null')||{r:0,c:0,l:1,i:{}};function roll(){let n=Math.random()*100,x=items[0],s=0;for(const a of items){s+=a[3];if(n<s){x=a;break}}d.r++;d.c+=10;d.i[x[1]]=(d.i[x[1]]||0)+1;localStorage.rng=JSON.stringify(d);orb.textContent=x[0];result.textContent=x[0]+' '+x[1];odds.textContent=x[4]+' · '+x[2];update()}function update(){rolls.textContent=d.r;coins.textContent=d.c;luck.textContent=d.l.toFixed(2);inv.innerHTML='<h2>🎒 Inventario</h2>'+items.map(x=>'<div>'+x[0]+' '+x[1]+' — '+(d.i[x[1]]||0)+'</div>').join('')}update();</script></body></html>
