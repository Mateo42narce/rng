<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RNG Cards Collection</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-color: #1e293b;
      --accent-color: #38bdf8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 { margin-bottom: 5px; }
    .stats { color: #94a3b8; margin-bottom: 20px; }

    /* Área de la Carta */
    .card-container {
      perspective: 1000px;
      margin-bottom: 25px;
    }

    .card {
      width: 220px;
      height: 310px;
      background-color: var(--card-color);
      border-radius: 16px;
      border: 4px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .card-icon { font-size: 60px; margin-bottom: 10px; }
    .card-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
    .card-rarity { font-size: 14px; opacity: 0.8; }

    /* Botones */
    button {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background-color: #7dd3fc; transform: scale(1.05); }
    button:active { transform: scale(0.98); }

    /* Colección / Álbum */
    .album-title { margin-top: 40px; border-bottom: 2px solid #334155; width: 100%; max-width: 500px; text-align: center; padding-bottom: 10px; }
    .album {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
    }

    .album-item {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      border: 2px solid #334155;
      opacity: 0.3;
    }

    .album-item.unlocked { opacity: 1; }
  </style>
</head>
<body>

  <h1>🎴 Card RNG 2D</h1>
  <div class="stats">Tiradas totales: <span id="total-rolls">0</span></div>

  <!-- Zona de Carta Principal -->
  <div class="card-container">
    <div class="card" id="main-card">
      <div class="card-icon" id="card-icon">❓</div>
      <div class="card-title" id="card-title">Pulsa Tirar</div>
      <div class="card-rarity" id="card-rarity">1 en 1</div>
    </div>
  </div>

  <button onclick="roll()">🎲 ¡TIRAR!</button>

  <!-- Álbum de Colección -->
  <h2 class="album-title">Colección (<span id="unlocked-count">0</span>/5)</h2>
  <div class="album" id="album"></div>

  <script>
    // 1. Tabla de Probabilidades y Rarezas
    const CARDS = [
      { name: "Madera", chance: 2, color: "#8b5cf6", icon: "🪵", border: "#a1a1aa" },
      { name: "Hierro", chance: 5, color: "#3b82f6", icon: "⚔️", border: "#60a5fa" },
      { name: "Oro", chance: 20, color: "#eab308", icon: "👑", border: "#fde047" },
      { name: "Diamante", chance: 100, color: "#06b6d4", icon: "💎", border: "#67e8f9" },
      { name: "Místico", chance: 1000, color: "#ef4444", icon: "🔥", border: "#f87171" }
    ];

    let totalRolls = 0;
    let unlocked = new Set();

    // Renderizar espacio del álbum
    const albumEl = document.getElementById("album");
    CARDS.forEach((card, index) => {
      const item = document.createElement("div");
      item.className = "album-item";
      item.id = `album-${index}`;
      item.innerHTML = `<div>${card.icon}</div><div><b>${card.name}</b></div><div>1/${card.chance}</div>`;
      albumEl.appendChild(item);
    });

    // 2. Lógica del RNG
    function roll() {
      totalRolls++;
      document.getElementById("total-rolls").innerText = totalRolls;

      const rand = Math.random();
      // Ordenar por más raro primero
      const sortedCards = [...CARDS].sort((a, b) => b.chance - a.chance);

      let selected = CARDS[0]; // Por defecto la más común
      for (let card of sortedCards) {
        if (rand < (1 / card.chance)) {
          selected = card;
          break;
        }
      }

      // 3. Actualizar la Carta en Pantalla
      const cardEl = document.getElementById("main-card");
      document.getElementById("card-icon").innerText = selected.icon;
      document.getElementById("card-title").innerText = selected.name;
      document.getElementById("card-rarity").innerText = `Probabilidad: 1 en ${selected.chance}`;
      
      // Estilos visuales según la rareza
      cardEl.style.borderColor = selected.border;
      cardEl.style.boxShadow = `0 0 20px ${selected.border}88`;

      // Registrar en el Álbum
      const cardIndex = CARDS.findIndex(c => c.name === selected.name);
      if (!unlocked.has(cardIndex)) {
        unlocked.add(cardIndex);
        document.getElementById(`album-${cardIndex}`).classList.add("unlocked");
        document.getElementById(`album-${cardIndex}`).style.borderColor = selected.border;
        document.getElementById("unlocked-count").innerText = unlocked.size;
      }
    }
  </script>
</body>
</html>
